# QuantMind OSS Edition - Docker Compose
# 单镜像部署，所有服务运行在一个容器内

name: quantmind

services:
  # 1. 数据库 (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: quantmind-db
    shm_size: 256mb
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次创建数据库时自动初始化所有表结构（PostgreSQL 官方镜像支持 /docker-entrypoint-initdb.d/）
      - ./db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - quantmind-net

  # 2. 缓存 (Redis) - 统一实例
  redis:
    image: redis:7-alpine
    container_name: quantmind-redis
    env_file:
      - ./.env
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: >-
      sh -c 'exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --databases 16 --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quantmind-net

  # 3. QuantMind 核心服务 (单镜像运行所有后端服务)
  quantmind:
    image: quantmind-oss:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.oss
      args:
        TORCH_DEVICE: ${TORCH_DEVICE:-cpu}
        # 阿里云镜像未同步 torch==2.9.1+cpu；默认使用 PyTorch 官方 CPU 索引。
        # 私有镜像/离线 wheel 场景仍可通过根 .env 的 TORCH_CPU_INDEX_URL 覆盖。
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_GPU_INDEX_URL: ${TORCH_GPU_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    platform: linux/amd64
    # GPU 可选：无 NVIDIA 驱动的主机请保持注释。
    # 有 GPU 加速训练需求时取消注释（需安装 nvidia-container-toolkit）。
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: 1
    #          capabilities: [gpu]
    container_name: quantmind
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"  # API Gateway
      - "8001:8001"  # Engine (Qlib回测)
      - "8002:8002"  # Trade (交易服务)
      - "8003:8003"  # Stream (实时行情)
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      - QUANTMIND_RUNTIME=docker
      - PYTHONPATH=/app
    volumes:
      # 运行时数据
      - ./data:/data
      # AI 模型文件 (按需下载)
      - ./models:/app/models
      # Qlib 历史数据 (按需下载)
      - ./db:/app/db
      # 日志
      - ./logs:/app/logs
       # 后端代码 (外挂载解决热更新问题)
      - ./backend:/app/backend
      - ./config:/app/config
      - ./scripts:/app/scripts
      # AlphaAgent 包源码（容器内 Python 通过 PYTHONPATH=/app 直接 import）
      - ./alphaagent:/app/alphaagent
      # TradingAgents-Astock 多Agent投研框架
      - ./TradingAgents-astock:/app/TradingAgents-astock
      # 训练编排器会把该宿主机脚本再挂载进训练子容器，以便无需重建镜像即可更新训练逻辑
      - ./docker/training:/app/docker/training
      # 策略模板
      - ./strategy_templates:/app/strategy_templates
      # 用户股票池文件 (AI策略生成)
      - ./user_pools_local:/app/user_pools_local
      # RD-Agent 已 pip install 到镜像中，不再需要运行时挂载
      # 允许 API 容器调用宿主机 Docker 启动训练容器
      - /var/run/docker.sock:/var/run/docker.sock
      # QwenPaw 共享文件目录
      - qwenpaw-shared:/qwenpaw-shared
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
    networks:
      - quantmind-net

  # 4. Celery Worker (Qlib 回测任务)
  celery-worker:
    image: quantmind-oss:latest
    platform: linux/amd64
    container_name: quantmind-celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      - QUANTMIND_RUNTIME=docker
      - PYTHONPATH=/app
    volumes:
      # 运行时数据
      - ./data:/data
      # AI 模型文件
      - ./models:/app/models
      # Qlib 历史数据
      - ./db:/app/db
      # 日志
      - ./logs:/app/logs
      # 用户股票池文件 (AI策略生成)
      - ./user_pools_local:/app/user_pools_local
    command: celery -A backend.services.engine.qlib_app.celery_config:celery_app worker -Q ${QLIB_CELERY_QUEUE:-qlib_backtest_srv} --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - quantmind-net

  # 4b. Celery beat (定时任务调度: 资讯 enrich / matcher 重载等)
  celery-beat:
    image: quantmind-oss:latest
    platform: linux/amd64
    container_name: quantmind-celery-beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      - QUANTMIND_RUNTIME=docker
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./data:/data
      - ./db:/app/db
    command: celery -A backend.services.engine.qlib_app.celery_config:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - quantmind-net

  # 5. Web 前端 (浏览器访问，无需安装 Electron)
  web:
    image: quantmind-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: quantmind-web
    depends_on:
      quantmind:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3080}:80"
    environment:
      # 默认由同一 Compose 网络中的后端容器提供 API。
      # 场景 2 可在启动命令中临时设为 host.docker.internal:8000。
      - WEB_API_UPSTREAM=${WEB_API_UPSTREAM:-quantmind:8000}
    # Linux Docker 也能以 host.docker.internal 访问宿主机后端；
    # 场景 1 中该别名不会参与实际请求。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - quantmind-net

  # 5a. Data Gateway (多数据源金融数据网关: akshare/eastmoney)
  data-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-gateway
    container_name: quantmind-data-gateway
    ports:
      - "${DATA_GATEWAY_PORT:-8004}:8004"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - quantmind-net

  # 5c. Dashboard (OpenBB + Streamlit 数据看板)
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: quantmind-dashboard
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-quantmind}
      - DB_USER=${DB_USER:-quantmind}
      - DB_PASSWORD=${DB_PASSWORD:-quantmind2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HUNTLY_BASE_URL=http://quantmind-huntly
      - HUNTLY_USERNAME=${HUNTLY_USERNAME:-changeme}
      - HUNTLY_PASSWORD=${HUNTLY_PASSWORD:-changeme}
    volumes:
      - ./data:/data
      - ./db:/app/db
      - ./dashboard:/app/dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - quantmind-net

  # 6. Huntly (财经资讯/RSS/Twitter 聚合订阅源)
  # 提供新闻流 + 可结构化的财务事件源
  # 前端通过 QuantMind News 代理访问 (零 401 风险)
  huntly:
    image: lcomplete/huntly:latest
    container_name: quantmind-huntly
    ports:
      - "${HUNTLY_PORT:-8090}:80"
    volumes:
      - ./data/huntly:/data
    environment:
      - TZ=Asia/Shanghai
      # 默认管理员账号 (首次启动自动创建)
      - HUNTLY_DEFAULT_USERNAME=${HUNTLY_USERNAME:-changeme}
      - HUNTLY_DEFAULT_PASSWORD=${HUNTLY_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - quantmind-net

  # 6b. RSSHub (为 Huntly 提供 RSS 源生成 — Twitter/微博/雪球/财经站点等)
  # Huntly 端订阅地址示例：http://rsshub:1200/twitter/user/<handle>
  rsshub:
    image: diygod/rsshub:latest
    container_name: quantmind-rsshub
    ports:
      - "${RSSHUB_PORT:-1200}:1200"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - CACHE_TYPE=redis
      # 默认复用根 .env 的 Redis 密码。若密码包含 @、:、/ 等 URI 保留字符，
      # 请在根 .env 设置 URL 编码后的 RSSHUB_REDIS_URL 覆盖此默认值。
      - REDIS_URL=${RSSHUB_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/3}
      - CACHE_EXPIRE=300
      - CACHE_CONTENT_EXPIRE=3600
      - REQUEST_RETRY=2
      - LISTEN_INADDR_ANY=1
      - PUPPETEER_SKIP_DOWNLOAD=true
      # 可选：填入 .env 后可启用 Twitter/微博等需登录的源
      # - TWITTER_USERNAME=${TWITTER_USERNAME:-}
      # - TWITTER_PASSWORD=${TWITTER_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1200/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - quantmind-net

  # 7. QwenPaw (QuantBot 聊天机器人)
  qwenpaw:
    image: agentscope/qwenpaw:latest
    container_name: qwenpaw
    ports:
      - "0.0.0.0:8089:8088"
    networks:
      quantmind-net:
        aliases:
          - copaw
    environment:
      # QuantMind 代码库和数据库访问（与 quantmind 容器一致）
      - PYTHONPATH=/app
      - DB_DRIVER=asyncpg
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-quantmind}
      - DB_USER=${DB_USER:-quantmind}
      - DB_PASSWORD=${DB_PASSWORD:-quantmind2026}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-quantmind}:${DB_PASSWORD:-quantmind2026}@db:5432/${DB_NAME:-quantmind}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STORAGE_MODE=local
      - STORAGE_ROOT=/data
      - MARGIN_STOCK_POOL_PATH=/data/融资融券.json
      - STRATEGY_TEMPLATES_DIR=/app/strategy_templates
      - QLIB_BACKTEST_RESULT_DIR=/data/backtest_results
      - QLIB_BACKTEST_KERNELS=1
      - INTERNAL_CALL_SECRET=${INTERNAL_CALL_SECRET:-changeme-internal-secret}
      - QUANTMIND_API_BASE_URL=http://quantmind:8000
      - QUANTMIND_ENGINE_URL=http://quantmind:8001
      - QUANTMIND_USER_ID=qwenpaw
      - QWENPAW_SHARED_FILES_DIR=/qwenpaw-shared
      - QWENPAW_CORS_ORIGINS=http://192.168.31.68:3080,http://localhost:3080,http://127.0.0.1:3080,http://192.168.31.68:8089,http://localhost:8089
      # 远程数据源（用于数据同步脚本）
      - SOURCE_DATABASE_URL=${SOURCE_DATABASE_URL:-postgresql://user:pass@localhost:5432/quantmind}
      - SYNC_MAX_DAYS=30
      - TZ=Asia/Shanghai
    volumes:
      # QwenPaw 自有数据
      - qwenpaw-data:/app/working
      - qwenpaw-secrets:/app/working.secret
      - qwenpaw-backups:/app/working.backups
      # QuantMind 代码库（只读，避免误修改）
      - ./backend:/app/backend:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./strategy_templates:/app/strategy_templates:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      # 项目根目录（只读，供 Agent 查找本地文件/技能 zip 等）
      - ./:/quantmind:ro
      # RD-Agent 已 pip install 到镜像中，不再需要运行时挂载
      # QuantMind 数据（读写）
      - ./data:/data
      - ./db:/app/db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./user_pools_local:/app/user_pools_local
      # 共享文件目录
      - qwenpaw-shared:/qwenpaw-shared
      # 允许调用宿主机 Docker（启动训练容器等）
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped


networks:
  quantmind-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qwenpaw-data:
  qwenpaw-secrets:
  qwenpaw-backups:
  qwenpaw-shared:
